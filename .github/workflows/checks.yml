name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: email_review_tool_test
          POSTGRES_USER: email_review
          POSTGRES_PASSWORD: email_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U email_review -d email_review_tool_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://email_review:email_review@localhost:5432/email_review_tool_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Migrate test database
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          goose -dir ../../db/migrations postgres "$TEST_DATABASE_URL" up

      - name: Test
        run: go test ./...

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
