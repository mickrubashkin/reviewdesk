<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no" />
  <title data-email-subject></title>
  <!--[if mso]>
      <xml>
        <o:OfficeDocumentSettings>
          <o:AllowPNG />
          <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
      </xml>
    <![endif]-->
  <style type="text/css">
    body,
    table,
    td,
    a {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    table,
    td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      outline: none;
      text-decoration: none;
      display: block;
    }
  </style>
</head>

<body style="margin: 0; padding: 0; min-width: 100%; background-color: #d7e9f8">
  <div style="
        display: none;
        font-size: 1px;
        color: #f2f2f2;
        line-height: 1px;
        max-height: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        mso-hide: all;
        visibility: hidden;
        width: 0;
      ">
    <span data-email-preheader></span>
    &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
    &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
  </div>

  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#D7E9F8" style="
        border-collapse: collapse;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
        background-color: #d7e9f8;
      ">
    <tr>
      <td align="center" valign="top" style="margin: 0; padding: 0">
        <!--[if mso]>
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="width:600px;">
            <tr>
              <td>
          <![endif]-->
        <div style="width: 100%; max-width: 600px; margin: 0 auto">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="
                width: 100%;
                max-width: 600px;
                border-collapse: collapse;
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
                background-color: #ffffff;
              ">
            <!-- blocks -->
          </table>
        </div>
        <!--[if mso]>
              </td>
            </tr>
          </table>
          <![endif]-->
      </td>
    </tr>
  </table>
</body>

</html>
