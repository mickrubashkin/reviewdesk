<tr>
  <td style="padding: 0 0 28px 0;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
      style="border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
      <tr>
        <td align="left" bgcolor="#effbff" style="
              padding: 26px 24px 28px 24px;
              background-color: #effbff;
            ">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="
                border-collapse: collapse;
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
              ">
            <tr>
              <td align="left" style="
                    padding: 0px 0 0 0;
                    font-family: Helvetica, Arial, sans-serif;
                    font-size: 16px;
                    line-height: 24px;
                    color: #063683;
                  ">
                <strong data-edit-text="login_label" data-review-block="login_label">Login:</strong>
                <span style="
                      color: #c126d4;
                      font-family: monospace;
                      font-size: 16px;
                      line-height: 28px;
                      letter-spacing: 0.5px;
                    ">#HTML_LOGIN#</span>
                <br />
                <strong data-edit-text="password_label" data-review-block="password_label">Password:</strong>
                <span style="
                      color: #c126d4;
                      font-family: monospace;
                      font-size: 16px;
                      line-height: 28px;
                      letter-spacing: 0.5px;
                    ">#PASSWORD#</span><br />
                <a href="https://acme-cloud.example/reset-password" target="_blank"
                  style="
                      color: #409eef;
                      font-size: 12px;
                      line-height: 16px;
                      font-style: italic;
                    " data-review-block="password_security_note_link"
                  data-edit-text="password_security_note_text"
                  data-edit-attr-href="password_security_note_url">(For security reasons, we recommend changing your password after the first login)</a>
                <br /><br />
                <strong data-edit-text="login_here_text" data-review-block="login_here_text">Login here:</strong>
                <a href="https://acme-cloud.example/login" target="_blank" style="
                      color: #409eef;
                      text-decoration: underline;
                      font-weight: 700;
                    " data-review-block="partner_login_link" data-edit-text="partner_login_link_text"
                  data-edit-attr-href="partner_login_link_url">acme-cloud.example/login</a><br />
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
